<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Warehouse Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0f1a; color: #e0e0e0; min-height: 100vh; }
    header { background: #16213e; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #1e2d4a; }
    header h1 { font-size: 20px; font-weight: 700; color: #fff; }
    .badge { font-size: 11px; padding: 4px 10px; border-radius: 20px; font-weight: 600; }
    .badge-green { background: #1b5e20; color: #a5d6a7; }
    .badge-red { background: #b71c1c; color: #ffcdd2; }
    .badge-gray { background: #333; color: #aaa; }
    .badge-orange { background: #e65100; color: #ffccbc; }
    .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
    .section-title { font-size: 14px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 16px; margin-top: 32px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .card { background: #16213e; border-radius: 12px; padding: 20px; border: 1px solid #1e2d4a; }
    .card h3 { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
    .card .sub { font-size: 12px; color: #888; margin-bottom: 12px; }
    .card .ip { font-size: 13px; color: #e94560; margin-bottom: 16px; font-family: monospace; }
    .rack-row { display: flex; gap: 8px; margin-top: 12px; }
    .rack-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; background: #0f3460; color: #aaa; transition: all 0.2s; }
    .rack-btn:hover { background: #e94560; color: #fff; }
    .rack-btn.active { background: #1b5e20; color: #a5d6a7; }
    .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; margin-bottom: 8px; }
    .stat { background: #16213e; border-radius: 12px; padding: 20px; border: 1px solid #1e2d4a; text-align: center; }
    .stat .num { font-size: 32px; font-weight: 700; color: #e94560; }
    .stat .label { font-size: 12px; color: #888; margin-top: 4px; }
    .refresh-btn { background: #e94560; color: #fff; border: none; padding: 8px 18px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .refresh-btn:hover { background: #c0392b; }
    .refresh-btn:active { transform: scale(0.97); }
    table { width: 100%; border-collapse: collapse; background: #16213e; border-radius: 12px; overflow: hidden; margin-top: 8px; }
    th { background: #0f3460; padding: 12px 16px; text-align: left; font-size: 12px; font-weight: 600; color: #888; text-transform: uppercase; }
    td { padding: 12px 16px; font-size: 13px; border-bottom: 1px solid #1e2d4a; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #1a2a4a; }
    .rack-tag { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
    .RackA { background: #1b5e20; color: #a5d6a7; }
    .RackB { background: #0d47a1; color: #90caf9; }
    .RackC { background: #4a148c; color: #ce93d8; }
    .empty { text-align: center; color: #555; padding: 40px; font-size: 14px; }
    .time { font-size: 11px; color: #555; }
    .active-rack { font-size: 12px; color: #a5d6a7; margin-bottom: 8px; }
    .no-rack { font-size: 12px; color: #555; margin-bottom: 8px; }
    .last-seen { font-size: 11px; color: #555; margin-top: 8px; }
  </style>
</head>
<body>

<header>
  <h1>Warehouse Dashboard</h1>
  <div style="display:flex;align-items:center;gap:10px;">
    <span id="mqttStatus" class="badge badge-gray">Loading...</span>
    <span id="lastUpdate" class="time"></span>
    <button class="refresh-btn" id="refreshBtn">Refresh</button>
  </div>
</header>

<div class="container">

  <div class="section-title" style="margin-top:0;">Overview</div>
  <div class="stats">
    <div class="stat">
      <div class="num" id="statWarehouses">—</div>
      <div class="label">Warehouses</div>
    </div>
    <div class="stat">
      <div class="num" id="statOnline">—</div>
      <div class="label">ESP32 Online</div>
    </div>
    <div class="stat">
      <div class="num" id="statScans">—</div>
      <div class="label">Total Scans</div>
    </div>
    <div class="stat">
      <div class="num" id="statActive">—</div>
      <div class="label">Active LEDs</div>
    </div>
  </div>

  <div class="section-title">Warehouses & Rack Control</div>
  <div id="warehouseGrid" class="grid">
    <div class="card"><div class="empty">Loading...</div></div>
  </div>

  <div class="section-title">Scan History</div>
  <table>
    <thead>
      <tr>
        <th>Time</th>
        <th>Barcode</th>
        <th>Product</th>
        <th>Warehouse</th>
        <th>Rack</th>
      </tr>
    </thead>
    <tbody id="historyBody">
      <tr><td colspan="5" class="empty">Loading...</td></tr>
    </tbody>
  </table>

</div>

<script>
  var isLoading = false;

  // Refresh button
  document.getElementById('refreshBtn').addEventListener('click', function() {
    loadAll();
  });

  async function loadAll() {
    if (isLoading) return;
    isLoading = true;
    document.getElementById('refreshBtn').textContent = 'Loading...';
    try {
      await Promise.all([loadHealth(), loadWarehouses(), loadHistory()]);
      document.getElementById('lastUpdate').textContent = 'Updated ' + new Date().toLocaleTimeString();
    } catch(e) {
      console.error('Load error:', e);
    }
    isLoading = false;
    document.getElementById('refreshBtn').textContent = 'Refresh';
  }

  async function loadHealth() {
    try {
      const r = await fetch('/api/health');
      const d = await r.json();
      var el = document.getElementById('mqttStatus');
      el.textContent = 'MQTT ' + d.mqtt;
      el.className = 'badge ' + (d.mqtt === 'connected' ? 'badge-green' : 'badge-red');
      document.getElementById('statScans').textContent = d.totalScans || 0;
    } catch(e) {
      document.getElementById('mqttStatus').textContent = 'Server offline';
      document.getElementById('mqttStatus').className = 'badge badge-red';
    }
  }

  async function loadWarehouses() {
    try {
      const r = await fetch('/api/warehouses');
      const d = await r.json();
      var grid = document.getElementById('warehouseGrid');
      grid.innerHTML = '';

      var online = 0;
      var active = 0;
      document.getElementById('statWarehouses').textContent = d.warehouses.length;

      d.warehouses.forEach(function(w) {
        if (w.status === 'online') online++;
        if (w.activeRack) active++;

        var lastSeenText = '';
        if (w.lastSeen) {
          var secs = Math.floor((Date.now() - w.lastSeen) / 1000);
          lastSeenText = 'Last seen ' + secs + 's ago';
        } else {
          lastSeenText = 'Never connected';
        }

        var card = document.createElement('div');
        card.className = 'card';
        card.innerHTML =
          '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">' +
            '<h3>' + w.name + '</h3>' +
            '<span class="badge ' + (w.status === 'online' ? 'badge-green' : 'badge-red') + '">' + w.status + '</span>' +
          '</div>' +
          '<div class="sub">ID: ' + w.id + '</div>' +
          '<div class="ip">' + w.esp32Ip + '</div>' +
          (w.activeRack
            ? '<div class="active-rack">LED ON: ' + w.activeRack + '</div>'
            : '<div class="no-rack">All LEDs off</div>') +
          '<div style="font-size:12px;color:#888;margin-bottom:6px;">Manual control:</div>' +
          '<div class="rack-row">' +
            '<button class="rack-btn ' + (w.activeRack === 'RackA' ? 'active' : '') + '" onclick="lightRack(\'' + w.id + '\',\'RackA\')">RackA</button>' +
            '<button class="rack-btn ' + (w.activeRack === 'RackB' ? 'active' : '') + '" onclick="lightRack(\'' + w.id + '\',\'RackB\')">RackB</button>' +
            '<button class="rack-btn ' + (w.activeRack === 'RackC' ? 'active' : '') + '" onclick="lightRack(\'' + w.id + '\',\'RackC\')">RackC</button>' +
          '</div>' +
          '<div class="last-seen">' + lastSeenText + '</div>';

        grid.appendChild(card);
      });

      document.getElementById('statOnline').textContent = online;
      document.getElementById('statActive').textContent = active;
    } catch(e) {
      document.getElementById('warehouseGrid').innerHTML = '<div class="card"><div class="empty">Failed to load warehouses</div></div>';
    }
  }

  async function loadHistory() {
    try {
      const r = await fetch('/api/history');
      const d = await r.json();
      var tbody = document.getElementById('historyBody');

      if (!d.history || d.history.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="empty">No scans yet — scan a barcode from the app</td></tr>';
        return;
      }

      tbody.innerHTML = d.history.map(function(h) {
        return '<tr>' +
          '<td style="color:#888;">' + new Date(h.timestamp).toLocaleTimeString() + '</td>' +
          '<td style="font-family:monospace;font-size:12px;">' + h.barcode + '</td>' +
          '<td>' + h.product_name + '</td>' +
          '<td>' + h.warehouse_name + '</td>' +
          '<td><span class="rack-tag ' + h.rack + '">' + h.rack + '</span></td>' +
        '</tr>';
      }).join('');
    } catch(e) {
      document.getElementById('historyBody').innerHTML = '<tr><td colspan="5" class="empty">Failed to load history</td></tr>';
    }
  }

  async function lightRack(warehouseId, rack) {
    try {
      var r = await fetch('/api/light', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          warehouse_id: warehouseId,
          rack: rack,
          product_name: 'Manual',
          barcode: 'MANUAL'
        })
      });
      var d = await r.json();
      if (d.success) {
        setTimeout(loadWarehouses, 500);
      }
    } catch(e) {
      console.error('lightRack error:', e);
    }
  }

  // Load on start
  loadAll();

  // Auto refresh every 5 seconds
  setInterval(loadAll, 5000);
</script>
</body>
</html>
